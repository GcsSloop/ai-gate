name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Sync release metadata
        run: bash scripts/release/sync_release_metadata.sh --tag "${{ github.ref_name }}"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Backend tests
        run: bash ../scripts/ci/go_test_with_retry.sh
        working-directory: backend

      - name: Frontend tests
        run: npm --prefix frontend run test

      - name: Release script tests
        run: |
          bash scripts/test/desktop_updater_config_test.sh
          bash scripts/test/go_test_with_retry_test.sh
          bash scripts/test/notarize_macos_test.sh
          bash scripts/test/release_apple_signing_test.sh
          bash scripts/test/release_updater_signing_key_test.sh
          bash scripts/test/release_version_helpers_test.sh
          bash scripts/test/sync_release_metadata_test.sh
          bash scripts/test/collect_release_assets_test.sh
          bash scripts/test/release_updater_manifest_test.sh
          bash scripts/test/package_local_release_test.sh
          bash scripts/test/release_msvc_spub_test.sh

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_platform: macos
            runner: macos-latest
            tauri_target: universal-apple-darwin
            bundles: app
            sidecar_script: scripts/desktop/build_sidecar_macos.sh
            artifact_name: release-assets-macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - release_platform: windows
            runner: windows-latest
            tauri_target: x86_64-pc-windows-msvc
            bundles: msi
            sidecar_script: scripts/desktop/build_sidecar_windows.sh
            artifact_name: release-assets-windows
            rust_targets: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Sync release metadata
        run: bash scripts/release/sync_release_metadata.sh --tag "${{ github.ref_name }}"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Build sidecar
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash "${{ matrix.sidecar_script }}"

      - name: Desktop sidecar tests
        run: |
          cd desktop/src-tauri
          cargo test sidecar_ -q

      - name: Build desktop bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm --prefix desktop run tauri build -- \
            --target "${{ matrix.tauri_target }}" \
            --bundles "${{ matrix.bundles }}"

      - name: Prepare notarization key
        if: matrix.release_platform == 'macos'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [[ -z "${APPLE_API_KEY:-}" || -z "${APPLE_API_KEY_ID:-}" || -z "${APPLE_API_ISSUER:-}" ]]; then
            echo "Missing Apple notarization secrets. Required: APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY" >"$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >>"$GITHUB_ENV"

      - name: Import Apple signing certificate
        if: matrix.release_platform == 'macos'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [[ -z "${APPLE_CERTIFICATE_P12:-}" || -z "${APPLE_CERTIFICATE_PASSWORD:-}" || -z "${APPLE_SIGNING_IDENTITY:-}" ]]; then
            echo "Missing Apple signing secrets. Required: APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY" >&2
            exit 1
          fi

          apple_cert_path="$RUNNER_TEMP/apple-signing-cert.p12"
          APPLE_CERTIFICATE_P12="$APPLE_CERTIFICATE_P12" python3 -c 'import base64, os, sys; payload = os.environ.get("APPLE_CERTIFICATE_P12", ""); sys.exit("APPLE_CERTIFICATE_P12 is empty") if not payload else None; sys.stdout.buffer.write(base64.b64decode(payload, validate=True))' >"$apple_cert_path"

          APPLE_KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"
          APPLE_KEYCHAIN_PATH="$RUNNER_TEMP/apple-signing.keychain-db"

          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$APPLE_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$APPLE_KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$APPLE_KEYCHAIN_PATH"
          security import "$apple_cert_path" \
            -k "$APPLE_KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$APPLE_KEYCHAIN_PATH"

          existing_keychains=()
          while IFS= read -r keychain; do
            existing_keychains+=("$keychain")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*//; s/"//g')
          security list-keychains -d user -s "$APPLE_KEYCHAIN_PATH" "${existing_keychains[@]}"
          security default-keychain -d user -s "$APPLE_KEYCHAIN_PATH"

          echo "APPLE_KEYCHAIN_PASSWORD=$APPLE_KEYCHAIN_PASSWORD" >>"$GITHUB_ENV"
          echo "APPLE_KEYCHAIN_PATH=$APPLE_KEYCHAIN_PATH" >>"$GITHUB_ENV"

      - name: Notarize macOS bundle
        if: matrix.release_platform == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash scripts/desktop/notarize_macos.sh

      - name: Collect release assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.release_platform }}
        run: bash scripts/desktop/collect_release_assets.sh

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

  build-server-plugin:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build server msvc plugin
        run: |
          bash scripts/release/build_ai_gate_msvc.sh \
            --version "${{ github.ref_name }}" \
            --target linux/amd64 \
            --output "$PWD/release-assets"

      - name: Upload server plugin
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-msvc
          path: release-assets/*.msvc
          if-no-files-found: error

  publish:
    needs:
      - build
      - build-server-plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate updater manifest
        run: |
          bash scripts/release/generate_updater_manifest.sh \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --assets-root dist \
            --output dist/latest.json \
            --notes "See GitHub release for details."

      - name: Install spub
        run: npm install -g spub

      - name: Publish server plugins to SANSI Cloud
        env:
          SANSI_CLOUD_PLUGIN_TOKEN: ${{ vars.SANSI_CLOUD_PLUGIN_TOKEN || secrets.SANSI_CLOUD_PLUGIN_TOKEN }}
        run: |
          if [[ -z "${SANSI_CLOUD_PLUGIN_TOKEN:-}" ]]; then
            echo "SANSI_CLOUD_PLUGIN_TOKEN repository variable or secret is required" >&2
            exit 1
          fi
          mapfile -t plugins < <(find dist -type f -name '*.msvc' | sort)
          if [[ "${#plugins[@]}" -eq 0 ]]; then
            echo "No .msvc plugins found under dist" >&2
            exit 1
          fi
          for plugin in "${plugins[@]}"; do
            spub -f "$plugin" -t "$SANSI_CLOUD_PLUGIN_TOKEN" --open
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.zip
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*.msi.sig
            dist/**/*.msvc
            dist/**/*.app.tar.gz
            dist/**/*.app.tar.gz.sig
            dist/latest.json
            dist/**/aigate-*-SHA256SUMS.txt
          fail_on_unmatched_files: true
