name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Sync release metadata
        run: bash scripts/release/sync_release_metadata.sh --tag "${{ github.ref_name }}"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Backend tests
        run: bash ../scripts/ci/go_test_with_retry.sh
        working-directory: backend

      - name: Frontend tests
        run: npm --prefix frontend run test

      - name: Release script tests
        run: |
          bash scripts/test/desktop_updater_config_test.sh
          bash scripts/test/go_test_with_retry_test.sh
          bash scripts/test/release_no_apple_signing_test.sh
          bash scripts/test/release_updater_signing_key_test.sh
          bash scripts/test/release_version_helpers_test.sh
          bash scripts/test/sync_release_metadata_test.sh
          bash scripts/test/collect_release_assets_test.sh
          bash scripts/test/release_updater_manifest_test.sh
          bash scripts/test/package_local_release_test.sh
          bash scripts/test/release_msvc_spub_test.sh

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - release_platform: macos
            runner: macos-latest
            tauri_target: universal-apple-darwin
            bundles: app
            sidecar_script: scripts/desktop/build_sidecar_macos.sh
            artifact_name: release-assets-macos
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - release_platform: windows
            runner: windows-latest
            tauri_target: x86_64-pc-windows-msvc
            bundles: msi
            sidecar_script: scripts/desktop/build_sidecar_windows.sh
            artifact_name: release-assets-windows
            rust_targets: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Sync release metadata
        run: bash scripts/release/sync_release_metadata.sh --tag "${{ github.ref_name }}"

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install desktop dependencies
        run: npm --prefix desktop ci

      - name: Build sidecar
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash "${{ matrix.sidecar_script }}"

      - name: Desktop sidecar tests
        run: |
          cd desktop/src-tauri
          cargo test sidecar_ -q

      - name: Build desktop bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm --prefix desktop run tauri build -- \
            --target "${{ matrix.tauri_target }}" \
            --bundles "${{ matrix.bundles }}"

      - name: Collect release assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.release_platform }}
        run: bash scripts/desktop/collect_release_assets.sh

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

  build-server-plugin:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.23"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build server msvc plugin
        run: |
          bash scripts/release/build_ai_gate_msvc.sh \
            --version "${{ github.ref_name }}" \
            --target linux/amd64 \
            --output "$PWD/release-assets"

      - name: Upload server plugin
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-msvc
          path: release-assets/*.msvc
          if-no-files-found: error

  publish:
    needs:
      - build
      - build-server-plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate updater manifest
        run: |
          bash scripts/release/generate_updater_manifest.sh \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --assets-root dist \
            --output dist/latest.json \
            --notes "See GitHub release for details."

      - name: Install spub
        run: npm install -g spub

      - name: Publish server plugins to SANSI Cloud
        env:
          SANSI_CLOUD_PLUGIN_TOKEN: ${{ vars.SANSI_CLOUD_PLUGIN_TOKEN || secrets.SANSI_CLOUD_PLUGIN_TOKEN }}
        run: |
          if [[ -z "${SANSI_CLOUD_PLUGIN_TOKEN:-}" ]]; then
            echo "SANSI_CLOUD_PLUGIN_TOKEN repository variable or secret is required" >&2
            exit 1
          fi
          mapfile -t plugins < <(find dist -type f -name '*.msvc' | sort)
          if [[ "${#plugins[@]}" -eq 0 ]]; then
            echo "No .msvc plugins found under dist" >&2
            exit 1
          fi
          for plugin in "${plugins[@]}"; do
            spub -f "$plugin" -t "$SANSI_CLOUD_PLUGIN_TOKEN" --open
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.zip
            dist/**/*.msi
            dist/**/*.msi.sig
            dist/**/*.msvc
            dist/**/*.app.tar.gz
            dist/**/*.app.tar.gz.sig
            dist/latest.json
            dist/**/aigate-*-SHA256SUMS.txt
          fail_on_unmatched_files: true
